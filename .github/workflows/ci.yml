name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: Format, Clippy & Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (deny all warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace test suite
        run: cargo test --workspace --locked

  release-linux:
    name: Release Build & CLI Smoke Test (Linux x86_64)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: CLI smoke & XDG/privacy hygiene check
        run: |
          TMP_XDG="$(mktemp -d)"
          trap 'rm -rf "$TMP_XDG"' EXIT
          export XDG_CONFIG_HOME="$TMP_XDG/config"
          export XDG_DATA_HOME="$TMP_XDG/data"
          export XDG_CACHE_HOME="$TMP_XDG/cache"
          export XDG_RUNTIME_DIR="$TMP_XDG/run"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          ./target/release/musick --help
          STATUS_OUT="$(./target/release/musick auth status)"
          echo "$STATUS_OUT"
          echo "$STATUS_OUT" | grep -q "Auth mode:   anonymous"
          echo "$STATUS_OUT" | grep -q "Telemetry:   disabled"
          ./target/release/musick cache stats
          ./target/release/musick cache prune
          ./target/release/musick cache clear

          test -z "$(git status --porcelain)"

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: musick-linux-x86_64
          path: target/release/musick
          retention-days: 14
