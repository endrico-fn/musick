[package]
name = "musick-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "musick"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["fast-resolver"]
fast-resolver = ["musick-audio/fast-resolver"]

[dependencies]
base64.workspace = true
clap.workspace = true
crossterm.workspace = true
hex.workspace = true
image.workspace = true
lru.workspace = true
musick-audio = { path = "../musick-audio", default-features = false }
musick-core = { path = "../musick-core" }
ratatui.workspace = true
ratatui-image.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/musick-linux-{ target-arch }.tar.gz"
bin-dir = "musick"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/musick-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/musick-linux-aarch64.tar.gz"

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
