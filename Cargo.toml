[workspace]
resolver = "3"
members = [
    "crates/musick-core",
    "crates/musick-audio",
    "crates/musick-tui",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/endrico-fn/musick"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6.0"
hex = "0.4"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
keyring = "4.2"
lru = "0.19"
mpris-server = { version = "0.11", features = ["tokio"] }
rand = "0.10"
rapidfuzz = "0.5"
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "charset", "http2", "system-proxy", "json", "query", "gzip", "brotli", "form"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util", "signal"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.29", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
