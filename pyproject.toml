[project]
name = "musick"
version = "0.1.0"
description = "Modular terminal YouTube Music player (Textual + mpv), privacy-first."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.86",
    "textual-image>=0.8",
    "ytmusicapi>=1.8",
    "httpx[http2]>=0.27",
    "pillow>=10.4",
    "rapidfuzz>=3.9",
    "platformdirs>=4.2",
    "yt-dlp>=2026.10.26",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
musick = "musick.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musick"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "BLE",
    "S",
    "FURB",
    "PLR1716",
    "RUF",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "TRY300",
    "A",
    "RSE",
    "C4",
]
ignore = [
    "S101",  # assert used in pytest / invariants
    "S311",  # random.Random used for non-cryptographic playlist shuffle
    "S603",  # subprocess calls pass explicit argument arrays (no shell=True)
    "S607",  # media tools (mpv, yt-dlp, cava) resolved via PATH / shutil.which
    "A002",  # ytmusicapi compatibility mocks use `filter=` keyword parameter
]
